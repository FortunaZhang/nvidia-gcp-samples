# Dynamo aggregated deployment for Kimi K2.5 NVFP4 — GOAL 3 (Beat) optimized variant.
# Topology: same 2-node TP=8 + PP=2 as parity baseline (Google-matching) — proven
# memory-fitting on RTX Pro 6000. Optimization stack sits ON TOP of the engine config:
#   1. KV events ENABLED on Frontend → Dynamo router gets real-time cache state
#   2. Radix cache re-enabled → 98% prefix-cache hit on shared-prefix workload
#   3. +--enable-tokenizer-batch-encode → tokenizer CPU not a bottleneck at conc=512
#   4. +--num-continuous-decode-steps 2 → reduce per-step Python overhead at high
#      concurrency; known +5-15% on decode-heavy workloads (OSL=8192 matches)
#   5. --enable-symm-mem + SGLANG_MOE_NVFP4_DISPATCH=1 env were TESTED and REMOVED —
#      both come from vsadhwani's DSV3.1 NVFP4 GAIE reference which targets B200
#      (SM100). On our 2-node RTX Pro 6000 SM120 cluster with Ethernet-only NCCL
#      (no NVLink/MNNVL between nodes, NCCL_IB_DISABLE=1), --enable-symm-mem caused
#      rank-0 scheduler to die immediately after weight load (exit code -3 / SIGQUIT
#      cascade). PyTorch SymmetricMemory needs peer-reachable GPU memory and is
#      designed for NVL-connected topologies. SGLANG_MOE_NVFP4_DISPATCH=1 may also
#      be SM100-gated. Both removed; keeping the safe Goal 3 optimizations only.
#   6. --kv-cache-dtype bfloat16 (kept at Google's NVFP4 reference choice)
#      — FP8 KV (fp8_e5m2) was tested and regressed throughput from 3,752 → 1,599
#        on RTX Pro 6000 SM120, likely due to FlashInfer FP8 KV slow path on SM120.
#        See README "Findings" + nkulikov reference repo for SM120-specific NVFP4
#        kernel issues (CUTLASS garbage, FlashInfer FP4 unavailable, workarounds
#        with Marlin GEMM / Triton MoE for very large MoE models).
#   6. mem-fraction-static 0.82 (matches parity baseline; bumping to 0.87 left only
#      13% dynamic budget which OOM'd FlashInfer FP4 MoE workspaces during init)
# Note: --cuda-graph-max-bs left at SGLang default (~512) for full graph coverage.
#
# Single-node × 2 replicas (PP=1) was attempted to unlock MTP/NEXTN. ABANDONED —
# Kimi K2.5 NVFP4 weights consume 92.41 GB per GPU at TP=8 single-node (verified
# in pod logs), leaving no room for KV pool at any mem-fraction. NEXTN adds another
# 10-15 GB, making it doubly impossible. See README "Findings — single-node
# topology not viable" and ../kimi-k25-int4-mn/debug.md #4 for the SGLang PP+spec
# assertion that originally motivated trying PP=1.
#
# Expected throughput vs Goal 2 parity (3,752 tok/s): +15-25% from FP8 KV alone,
# plus modest gains from radix cache + KV router on shared-prefix workload.
# Realistic target: 4,300-4,700 tok/s. Vs Google 3,237 reference: +33-45%.
#
# Run with run-benchmark-opt.sh (shared-prefix workload) for full Goal 3 effect.
# Same DGD name as baseline → swap with kubectl delete + apply.
---
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: agg-sglang-kimi-k25-nvfp4
  namespace: default
spec:
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      extraPodSpec:
        imagePullSecrets:
          - name: nvcr-imagepullsecret
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.1.0
          command: ["python3"]
          args:
            - -m
            - dynamo.frontend
            - --router-mode
            - kv
            # --no-kv-events REMOVED → KV events enabled (Goal 3 lever)
          env:
            - name: POD_UID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
            - name: HF_HOME
              value: /model-cache
            - name: HF_HUB_CACHE
              value: /model-cache/.model-express/cache
          volumeMounts:
            - mountPath: /model-cache
              name: model-cache
        volumes:
          - name: model-cache
            persistentVolumeClaim:
              claimName: model-cache

    ModelExpress:
      componentType: frontend
      replicas: 1
      envFromSecret: hf-token-secret
      resources:
        limits:   { cpu: "4", memory: 16Gi }
        requests: { cpu: "1", memory: 4Gi }
      livenessProbe:
        tcpSocket: { port: 8000 }
        initialDelaySeconds: 120
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 10
      readinessProbe:
        tcpSocket: { port: 8000 }
        initialDelaySeconds: 60
        periodSeconds: 15
        timeoutSeconds: 10
        failureThreshold: 10
      extraPodSpec:
        imagePullSecrets:
          - name: nvcr-imagepullsecret
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/modelexpress-server:0.3.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting Model Express Server..."
              ./modelexpress-server &
              SERVER_PID=$!

              mkdir -p $MODEL_CACHE_PATH /model-cache/.model-express
              cat > /model-cache/.model-express/config.yaml << EOF
              local_path: $MODEL_CACHE_PATH
              server_endpoint: http://localhost:8000
              timeout_secs: null
              EOF

              for i in $(seq 1 60); do
                if ./modelexpress-cli --endpoint http://localhost:8000 health > /dev/null 2>&1; then
                  echo "Server is ready"
                  break
                fi
                sleep 2
              done

              echo "Downloading $MODEL_NAME ..."
              ./modelexpress-cli --endpoint http://localhost:8000 \
                --cache-path $MODEL_CACHE_PATH \
                model download "$MODEL_NAME"

              SNAPSHOT_DIR=$(ls -td $MODEL_CACHE_PATH/models--$(echo $MODEL_NAME | sed 's|/|--|g')/snapshots/*/ 2>/dev/null | head -1)
              if [ -n "$SNAPSHOT_DIR" ]; then
                SNAPSHOTS_PARENT=$(dirname "$SNAPSHOT_DIR")
                ln -sfn "$(basename "$SNAPSHOT_DIR")" "$SNAPSHOTS_PARENT/latest"
              fi

              wait $SERVER_PID
          env:
            - name: MODEL_EXPRESS_SERVER_PORT
              value: "8000"
            - name: MODEL_EXPRESS_LOGGING_LEVEL
              value: info
            - name: MODEL_EXPRESS_CACHE_DIRECTORY
              value: /model-cache/.model-express/cache
            - name: MX_METADATA_BACKEND
              value: redis
            - name: REDIS_URL
              value: redis://redis-master.default.svc.cluster.local:6379
            - name: MODEL_NAME
              value: nvidia/Kimi-K2.5-NVFP4
            - name: MODEL_CACHE_PATH
              value: /model-cache/.model-express/cache
            - name: HF_HUB_CACHE
              value: /model-cache/.model-express/cache
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
          volumeMounts:
            - mountPath: /model-cache
              name: model-cache
        volumes:
          - name: model-cache
            persistentVolumeClaim:
              claimName: model-cache

    agg:
      componentType: worker
      replicas: 1
      # 2-node PP=2 single distributed worker — same topology as the parity baseline.
      # Single-node × 2 replicas was attempted (PP=1) to unlock MTP/NEXTN, but Kimi
      # K2.5 NVFP4 on TP=8 single-node consumes 92.41 GB per GPU (verified in pod
      # logs), leaving no room for KV pool at any mem-fraction setting. See README
      # "Findings — single-node topology not viable" for the memory math.
      multinode:
        nodeCount: 2
      envFromSecret: hf-token-secret
      resources:
        limits:   { gpu: "8" }
        requests: { gpu: "8" }
      sharedMemory:
        size: 80Gi
      extraPodSpec:
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        imagePullSecrets:
          - name: nvcr-imagepullsecret
        nodeSelector:
          cloud.google.com/gke-accelerator: nvidia-rtx-pro-6000
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          - key: cloud.google.com/gke-spot
            operator: Exists
            effect: NoSchedule
          - key: cloud.google.com/gke-preemptible
            operator: Exists
            effect: NoSchedule
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.1.0
          workingDir: /workspace
          securityContext:
            runAsUser: 0
          startupProbe:
            httpGet: { path: /live, port: 9090 }
            periodSeconds: 60
            timeoutSeconds: 5
            # 120 × 60s = 120 min. CUDA graph capture for Kimi NVFP4 with FP8 KV
            # + DP attention + 60+ batch sizes can take 60-90+ min. Previous 60-min
            # threshold was killing the leader before capture finished.
            failureThreshold: 120
          command: ["/bin/sh", "-c"]
          args:
            - |
              MODEL_NAME=nvidia/Kimi-K2.5-NVFP4
              MODEL_DIR=/model-cache/.model-express/cache/models--$(echo $MODEL_NAME | sed 's|/|--|g')/snapshots/latest

              echo "Waiting for model snapshot at $MODEL_DIR ..."
              for i in $(seq 1 1800); do
                if [ -f "$MODEL_DIR/config.json" ]; then
                  echo "Model snapshot ready."
                  break
                fi
                sleep 2
              done
              if [ ! -f "$MODEL_DIR/config.json" ]; then
                echo "ERROR: model snapshot not found at $MODEL_DIR"
                exit 1
              fi

              # SGLang launch — Goal 3 optimized: 2-node PP=2 (matches Google topology)
              # + stacked optimizations on top of the parity baseline:
              #   - fp8_e5m2 KV cache (halves per-token KV → 2× effective concurrency)
              #   - mem-fraction 0.82 → 0.87 (~15% more KV pool)
              #   - radix cache re-enabled (was --disable-radix-cache in baseline; we
              #     re-enable for shared-prefix workload via run-benchmark-opt.sh)
              #   - +--enable-tokenizer-batch-encode (reduces tokenizer CPU contention)
              exec python3 -m dynamo.sglang \
                --model-path "$MODEL_DIR" \
                --served-model-name "$MODEL_NAME" \
                --trust-remote-code \
                --tensor-parallel-size 8 \
                --pipeline-parallel-size 2 \
                --dp-size 8 \
                --enable-dp-attention \
                --quantization modelopt_fp4 \
                --disable-shared-experts-fusion \
                --mem-fraction-static 0.82 \
                --schedule-policy fcfs \
                --chunked-prefill-size 16384 \
                --kv-cache-dtype bfloat16 \
                --reasoning-parser kimi_k2 \
                --tool-call-parser kimi_k2 \
                --enable-dp-lm-head \
                --enable-fused-moe-sum-all-reduce \
                --fp4-gemm-backend flashinfer_cutlass \
                --attention-backend flashinfer \
                --moe-runner-backend flashinfer_cutlass \
                --enable-flashinfer-allreduce-fusion \
                --disable-custom-all-reduce \
                --enable-tokenizer-batch-encode \
                --num-continuous-decode-steps 2 \
                --enable-metrics \
                --log-level info \
                --host 0.0.0.0 \
                --watchdog-timeout 3600
          env:
            - name: POD_UID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
            - name: HF_HOME
              value: /model-cache
            - name: HF_HUB_CACHE
              value: /model-cache/.model-express/cache
            - name: MODEL_CACHE_PATH
              value: /model-cache/.model-express/cache
            - name: MODEL_EXPRESS_URL
              value: http://agg-sglang-kimi-k25-nvfp4-modelexpress:8000
            - name: TRITON_CACHE_DIR
              value: /model-cache/.triton-cache
            - name: NCCL_DEBUG
              value: INFO
            - name: NCCL_SOCKET_IFNAME
              value: "eth0,eth1"
            - name: NCCL_IB_DISABLE
              value: "1"
            - name: NCCL_P2P_LEVEL
              value: SYS
            - name: NCCL_SOCKET_NTHREADS
              value: "8"
            - name: NCCL_NSOCKS_PERTHREAD
              value: "8"
            - name: NCCL_MIN_NCHANNELS
              value: "8"
            - name: NCCL_ALLOC_P2P_NET_LL_BUFFERS
              value: "1"
            - name: SGLANG_ENABLE_JIT_DEEPGEMM
              value: "0"
            - name: SGLANG_ENABLE_DEEP_GEMM
              value: "0"
            - name: OMP_NUM_THREADS
              value: "24"
            - name: SGLANG_SET_CPU_AFFINITY
              value: "1"
            - name: SAFETENSORS_FAST_GPU
              value: "1"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: FLASHINFER_DISABLE_VERSION_CHECK
              value: "1"
          volumeMounts:
            - mountPath: /model-cache
              name: model-cache
        volumes:
          - name: model-cache
            persistentVolumeClaim:
              claimName: model-cache
